# Profil de démonstration — H2 en mémoire (sans PostgreSQL)
# Usage : mvn spring-boot:run -Dspring-boot.run.profiles=dev
server:
  port: 8085

spring:
  application:
    name: planning-service

  datasource:
    url: jdbc:h2:mem:planningdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    enabled: false
