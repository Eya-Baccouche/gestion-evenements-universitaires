server:
  port: 8085

spring:
  application:
    name: planning-service

  datasource:
    url: jdbc:postgresql://localhost:5432/planning_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none          # On gère le schéma via schema.sql
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  sql:
    init:
      mode: always             # Exécute schema.sql + data.sql au démarrage
      continue-on-error: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Configuration OpenFeign — microservice événements
evenements:
  service:
    name: evenements-service

logging:
  level:
    com.warriors.planning: DEBUG
