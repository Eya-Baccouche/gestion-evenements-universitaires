spring.application.name=sponsors
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/sponsors_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

evenements.service.url=http://localhost:8081/evenements
spring.cloud.openfeign.client.config.evenements.connectTimeout=3000
spring.cloud.openfeign.client.config.evenements.readTimeout=5000

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

sponsors.messaging.enabled=true
