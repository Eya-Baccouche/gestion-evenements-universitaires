server.port=8085

# Context-path pour differencier ce microservice des autres services
server.servlet.context-path=/statistiques

# ===================================================================
# LIEN SWAGGER UI POUR TESTER LES APIS :
# http://localhost:8085/statistiques/swagger-ui/index.html
# ===================================================================

# Connexion a la base de donnees PostgreSQL (Port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/statistiques_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Chargement automatique des donnees de test (data.sql)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
